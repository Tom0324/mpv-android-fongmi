name: Build ISO-enabled mpv AAR (DVD/Blu-ray)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson --break-system-packages

      - name: Use FongMi/mpv kernel (mpv 0.42 + ISO over HTTP) and apply AVC PTS patch
        run: |
          set -e
          cat > /tmp/fix_avc.py <<'PY'
          path = 'buildscripts/deps/mpv/player/video.c'
          import os
          if not os.path.exists(path):
              raise SystemExit('video.c missing: ' + path)
          src = open(path, encoding='utf-8').read()
          if 'PATCH: hwdec H.264' in src:
              print('already patched'); raise SystemExit(0)
          old = "            frame_time = 0;\n"
          if 'Invalid video timestamp' not in src or old not in src:
              print('AVC patch anchor not found in FongMi source; skipping (non-fatal)')
              raise SystemExit(0)
          w = src.index('Invalid video timestamp')
          pos = src.index(old, w)
          new = """                    /* PATCH: hwdec H.264 with B-frames emits non-monotonic
                     * decode-order PTS. Zeroing frame_time breaks adjust_sync
                     * and causes gradual A/V drift. Synthesize a monotonic PTS
                     * from container fps and keep a plausible frame_time. */
                    if (frame_time <= 0) {
                        float fps = 0;
                        if (mpctx->vo_chain && mpctx->vo_chain->filter)
                            fps = mpctx->vo_chain->filter->container_fps;
                        double est = (fps > 0 && fps < 1000) ? 1.0 / fps : 0;
                        if (est > 0) {
                            pts = mpctx->video_pts + est;
                            frame_time = est;
                            mpctx->next_frames[0]->pts = pts;
                        } else {
                            frame_time = 0;
                        }
                    } else {
                        frame_time = 0;
                    }
          """
          open(path,'w',encoding='utf-8',newline='\n').write(src[:pos]+new+src[pos+len(old):])
          print('patched', path)
          PY

      - name: Fetch deps, download mpv source, patch, then build
        run: |
          set -e
          buildscripts/include/ci.sh install
          cd buildscripts
          ./download.sh
          # Replace the official mpv tree with FongMi/mpv (same 0.42.0 base but
          # adds stream_iso.c: ISO detection over http/https — exactly what
          # NeoPlayer uses to play WebDAV ISO as a disc with titles/chapters).
          rm -rf deps/mpv
          git clone --depth=1 -b fongmi https://github.com/FongMi/mpv.git deps/mpv
          cd ..
          python3 /tmp/fix_avc.py
          grep -n 'stream_info_iso' buildscripts/deps/mpv/stream/stream_iso.c
          # verify ISO deps were downloaded
          ls -d buildscripts/deps/libdvdread buildscripts/deps/libdvdnav buildscripts/deps/libbluray
          cd buildscripts
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh --arch arm64 -n

      - name: Verify ISO symbols in libmpv
        run: |
          set -e
          MPV_SO=$(find buildscripts -name libmpv.so | head -1)
          echo "libmpv: $MPV_SO"
          test -n "$MPV_SO"
          # dvdnav_open is the essential marker (DVD ISO playback core).
          # libbluray/bluray may be stripped/inlined in static builds (beta3 has
          # bd_open_disk=0), so only warn on them instead of blocking the build.
          grep -a -q "dvdnav_open" "$MPV_SO" && echo "FOUND dvdnav_open" || { echo "MISSING dvdnav_open"; exit 1; }
          for sym in libbluray bluray; do
            if grep -a -q "$sym" "$MPV_SO"; then echo "FOUND $sym"; else echo "WARN: MISSING $sym"; fi
          done
          echo "ISO symbol check passed"

      - name: Upload AAR to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: native-avcfix-mpv042-iso-dvd-ffmpeg9.1-lp7.387.0
        run: |
          set -e
          test -f app/build/outputs/aar/app-release.aar
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "ISO-enabled mpv AAR" --notes "mpv 0.42.0 + AVC PTS patch + DVD/Blu-ray/ISO (dvdnav/libbluray/libdvdread), FFmpeg n9.1, libplacebo v7.387.0"
          gh release upload "$TAG" app/build/outputs/aar/app-release.aar --clobber
