name: Build ISO-enabled mpv AAR (DVD/Blu-ray)

on:
  workflow_dispatch:

env:
  MPV_GIT_URL: https://github.com/NextPlayerCloud/mpv.git
  MPV_GIT_REF: NeoPlayer
  FFMPEG_GIT_URL: https://github.com/NextPlayerCloud/FFmpeg.git
  MPV_ANDROID_ARCHES: arm64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson --break-system-packages

      - name: Use FongMi/mpv kernel (mpv 0.42 + ISO over HTTP) and apply AVC PTS patch
        run: |
          set -e
          cat > /tmp/fix_avc.py <<'PY'
          path = 'buildscripts/deps/mpv/player/video.c'
          import os
          if not os.path.exists(path):
              raise SystemExit('video.c missing: ' + path)
          src = open(path, encoding='utf-8').read()
          if 'PATCH: hwdec H.264' in src:
              print('already patched'); raise SystemExit(0)
          old = "            frame_time = 0;\n"
          # AVC PTS fix is MANDATORY — fail the build if the anchor is missing.
          if 'Invalid video timestamp' not in src or old not in src:
              raise SystemExit('FATAL: AVC patch anchor not found in FongMi video.c')
          w = src.index('Invalid video timestamp')
          pos = src.index(old, w)
          new = """                    /* PATCH: hwdec H.264 with B-frames emits non-monotonic
                     * decode-order PTS. Zeroing frame_time breaks adjust_sync
                     * and causes gradual A/V drift. Synthesize a monotonic PTS
                     * from container fps and keep a plausible frame_time. */
                    if (frame_time <= 0) {
                        float fps = 0;
                        if (mpctx->vo_chain && mpctx->vo_chain->filter)
                            fps = mpctx->vo_chain->filter->container_fps;
                        double est = (fps > 0 && fps < 1000) ? 1.0 / fps : 0;
                        if (est > 0) {
                            pts = mpctx->video_pts + est;
                            frame_time = est;
                            mpctx->next_frames[0]->pts = pts;
                        } else {
                            frame_time = 0;
                        }
                    } else {
                        frame_time = 0;
                    }
          """
          open(path,'w',encoding='utf-8',newline='\n').write(src[:pos]+new+src[pos+len(old):])
          print('patched', path)
          PY

      - name: Fetch exact fongmi deps, verify kernel, patch AVC, then build
        run: |
          set -e
          buildscripts/include/ci.sh install
          test "$(git -C buildscripts/deps/mpv rev-parse HEAD)" = "76f963cc4002125776f741738b6c1d8cc08daf18"
          python3 /tmp/fix_avc.py
          grep -n 'PATCH: hwdec H.264' buildscripts/deps/mpv/player/video.c
          grep -n 'stream_info_iso' buildscripts/deps/mpv/stream/stream_iso.c
          grep -n 'force-iso' buildscripts/deps/mpv/options/options.c
          grep -n 'stream_open_bluray_iso' buildscripts/deps/mpv/stream/stream_bluray.c
          # verify FongMi patches actually applied to libdvdnav (required for HTTP ISO)
          grep -q 'DVDNAV_HAVE_TIME_SEARCH_FLOOR' buildscripts/deps/libdvdnav/src/dvdnav/dvdnav.h
          grep -q 'dvdnav_time_search_floor' buildscripts/deps/libdvdnav/src/dvdnav/dvdnav.h
          ls -d buildscripts/deps/libdvdread buildscripts/deps/libdvdnav buildscripts/deps/libbluray
          cd buildscripts
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh --arch arm64 -n

      - name: Verify ISO/AVC/JNI artifacts
        run: |
          set -e
          MPV_SO=$(find buildscripts -name libmpv.so | head -1)
          echo "libmpv: $MPV_SO"
          test -n "$MPV_SO"
          grep -a -q "dvdnav_open" "$MPV_SO" && echo "FOUND dvdnav_open" || { echo "MISSING dvdnav_open"; exit 1; }
          if grep -a -q "ISO detected" "$MPV_SO"; then echo "FOUND stream_iso strings"; else echo "MISSING stream_iso strings"; exit 1; fi
          if grep -a -q "force-iso" "$MPV_SO"; then echo "FOUND force-iso"; else echo "MISSING force-iso"; exit 1; fi
          if grep -a -q "libbluray" "$MPV_SO" || grep -a -q "bd_open_stream" "$MPV_SO" || grep -a -q "bluray" "$MPV_SO"; then echo "FOUND bluray support"; else echo "MISSING bluray support"; exit 1; fi
          grep -n 'PATCH: hwdec H.264' buildscripts/deps/mpv/player/video.c
          PLAYER_SO=$(find buildscripts app -name libplayer.so | head -1)
          echo "libplayer: $PLAYER_SO"
          test -n "$PLAYER_SO"
          if grep -a -q "Java_is_xyz_mpv_MPVLib" "$PLAYER_SO"; then echo "FOUND MPVLib JNI"; else echo "MISSING MPVLib JNI"; exit 1; fi
          echo "ISO/AVC/JNI artifact checks passed"

      - name: Upload AAR to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: native-avcfix-mpv042-iso-neoplayer-ffmpeg8.1-fongmi-20261126
        run: |
          set -e
          test -f app/build/outputs/aar/app-release.aar
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "NeoPlayer recipe ISO AAR" --notes "mpv 0.42.0 + AVC PTS patch + stream_iso/fongmi + DVD/Blu-ray/ISO (dvdnav/libbluray/libdvdread), FFmpeg release-8.1-fongmi, libplacebo fongmi"
          gh release upload "$TAG" app/build/outputs/aar/app-release.aar --clobber
