name: Build ISO-enabled mpv AAR (DVD/Blu-ray)

on:
  workflow_dispatch:

env:
  MPV_GIT_URL: https://github.com/NextPlayerCloud/mpv.git
  MPV_GIT_REF: NeoPlayer
  FFMPEG_GIT_URL: https://github.com/NextPlayerCloud/FFmpeg.git
  MPV_ANDROID_ARCHES: arm64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson --break-system-packages

      - name: Use FongMi/mpv kernel (mpv 0.42 + ISO over HTTP) and apply AVC PTS patch
        run: |
          set -e
          cat > /tmp/fix_avc.py <<'PY'
          path = 'buildscripts/deps/mpv/player/video.c'
          import os
          if not os.path.exists(path):
              raise SystemExit('video.c missing: ' + path)
          src = open(path, encoding='utf-8').read()
          if 'PATCH: hwdec H.264' in src:
              print('already patched'); raise SystemExit(0)
          old = "            frame_time = 0;\n"
          # AVC PTS fix is MANDATORY — fail the build if the anchor is missing.
          if 'Invalid video timestamp' not in src or old not in src:
              raise SystemExit('FATAL: AVC patch anchor not found in FongMi video.c')
          w = src.index('Invalid video timestamp')
          pos = src.index(old, w)
          new = """                    /* PATCH: hwdec H.264 with B-frames emits non-monotonic
                     * decode-order PTS. Zeroing frame_time breaks adjust_sync
                     * and causes gradual A/V drift. Synthesize a monotonic PTS
                     * from container fps and keep a plausible frame_time. */
                    if (frame_time <= 0) {
                        float fps = 0;
                        if (mpctx->vo_chain && mpctx->vo_chain->filter)
                            fps = mpctx->vo_chain->filter->container_fps;
                        double est = (fps > 0 && fps < 1000) ? 1.0 / fps : 0;
                        if (est > 0) {
                            pts = mpctx->video_pts + est;
                            frame_time = est;
                            mpctx->next_frames[0]->pts = pts;
                        } else {
                            frame_time = 0;
                        }
                    } else {
                        frame_time = 0;
                    }
          """
          open(path,'w',encoding='utf-8',newline='\n').write(src[:pos]+new+src[pos+len(old):])
          print('patched', path)
          PY

      - name: Fetch exact fongmi deps, verify kernel, patch AVC, then build
        run: |
          set -e
          buildscripts/include/ci.sh install
          test "$(git -C buildscripts/deps/mpv rev-parse HEAD)" = "76f963cc4002125776f741738b6c1d8cc08daf18"
          python3 /tmp/fix_avc.py
          python3 - <<'PY'
          path = 'buildscripts/deps/mpv/demux/demux_disc.c'
          src = open(path, encoding='utf-8').read()
          marker = 'PATCH: disc slave demuxer cache'
          if marker in src:
              print('disc cache patch already applied')
          else:
              old = '    struct demuxer_params params = {\n        .force_format = "+lavf",\n        .external_stream = demuxer->stream,\n        .stream_flags = demuxer->stream_origin,\n        .depth = demuxer->depth + 1,\n    };\n'
              new = '    /* PATCH: disc slave demuxer cache */\n    struct demuxer_params params = {\n        .force_format = "+lavf",\n        .external_stream = demuxer->stream,\n        .stream_flags = demuxer->stream_origin,\n        .depth = demuxer->depth + 1,\n        .is_top_level = true,\n        .disable_timeline = true,\n    };\n'
              if src.count(old) != 2:
                  raise SystemExit('FATAL: demux_disc params anchors != 2: %d' % src.count(old))
              src = src.replace(old, new)
              nav_old = '            demux_set_nav_active(demuxer, nav.nav_active);\n'
              nav_new = '            /* PATCH: always allow demuxer prefetch during title playback */\n            demux_set_nav_active(demuxer, false);\n'
              if src.count(nav_old) != 1:
                  raise SystemExit('FATAL: demux_disc nav anchor != 1: %d' % src.count(nav_old))
              src = src.replace(nav_old, nav_new)
              open(path, 'w', encoding='utf-8', newline='\n').write(src)
              print('patched', path)
          PY
          grep -n 'PATCH: disc slave demuxer cache' buildscripts/deps/mpv/demux/demux_disc.c
          grep -n 'PATCH: always allow demuxer prefetch' buildscripts/deps/mpv/demux/demux_disc.c
          grep -n 'PATCH: hwdec H.264' buildscripts/deps/mpv/player/video.c
          grep -n 'stream_info_iso' buildscripts/deps/mpv/stream/stream_iso.c
          grep -n 'force-iso' buildscripts/deps/mpv/options/options.c
          grep -n 'stream_open_bluray_iso' buildscripts/deps/mpv/stream/stream_bluray.c
          # Patch: on playlist transitions the previous MediaCodec output surface
          # may still be connected to mpv's AImageReader when the next episode's
          # decoder calls configure (nativeWindowConnect -22 / already connected).
          # Retry configure briefly so the old codec can finish its async release.
          python3 - <<'PY'
          path = 'buildscripts/deps/ffmpeg/libavcodec/mediacodecdec_common.c'
          src = open(path, encoding='utf-8').read()
          marker = 'PATCH: mediacodec configure retry'
          if marker in src:
              print('mediacodec configure retry already applied')
          else:
              lines = src.split('\n')
              needle = 'status = ff_AMediaCodec_configure(s->codec, format, s->surface, NULL, 0);'
              idx = [i for i, ln in enumerate(lines) if needle in ln]
              if len(idx) != 1:
                  raise SystemExit('FATAL: mediacodec configure line count != 1: %d' % len(idx))
              i = idx[0]
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              block = [
                  indent + '/* PATCH: mediacodec configure retry */',
                  lines[i],
                  indent + 'for (int retry = 0; status < 0 && retry < 20; retry++) {',
                  indent + '    /* Previous episode codec may still be releasing the',
                  indent + '     * AImageReader surface during playlist transitions. */',
                  indent + '    av_usleep(100000);',
                  indent + '    ' + lines[i].strip(),
                  indent + '}',
              ]
              lines[i:i+1] = block
              open(path, 'w', encoding='utf-8', newline='\n').write('\n'.join(lines))
              print('patched', path)
          PY
          grep -n 'PATCH: mediacodec configure retry' buildscripts/deps/ffmpeg/libavcodec/mediacodecdec_common.c
          # Diagnostic: log whether FFmpeg actually stops the old MediaCodec on close.
          python3 .github/scripts/mediacodec_close_probe.py buildscripts/deps/ffmpeg/libavcodec/mediacodecdec_common.c
          grep -n 'PATCH: mediacodec close probe' buildscripts/deps/ffmpeg/libavcodec/mediacodecdec_common.c
          # PATCH: 15-line uninit() release order fix. Only reorder release
          # calls in hwdec_aimagereader.c; keep every NeoPlayer feature intact.
          python3 - <<'PY'
          from collections import Counter
          path = 'buildscripts/deps/mpv/video/out/hwdec/hwdec_aimagereader.c'
          src = open(path, encoding='utf-8').read()
          marker = 'PATCH: aimagereader uninit release order'
          marker_line = '    /* ' + marker + ' */'
          feature_anchors = [
              'HAVE_VULKAN',
              'supports_gpu_dovi_mapping',
              'AImage_getDataSpace',
              'IMAGE_TIMESTAMP_TOLERANCE_NS',
              'retain_previous_frame',
              'AImageReader_acquireLatestImageAsync',
              'AImage_deleteAsync',
              'AImageReader_newWithUsage',
              'AImageReader stats',
          ]
          for feat in feature_anchors:
              if feat not in src:
                  raise SystemExit('FATAL: NeoPlayer feature anchor missing: ' + feat)
          if marker in src:
              print('aimagereader uninit order patch already applied')
          else:
              lines = src.split('\n')
              starts = [i for i, ln in enumerate(lines)
                        if ln.startswith('static void uninit(struct ra_hwdec *hw)')]
              if len(starts) != 1:
                  raise SystemExit('FATAL: uninit() count != 1: %d' % len(starts))
              start = starts[0]
              depth = 0
              end = None
              for i in range(start, len(lines)):
                  depth += lines[i].count('{') - lines[i].count('}')
                  if depth == 0 and i > start:
                      end = i
                      break
              if end is None:
                  raise SystemExit('FATAL: uninit() closing brace not found')
              body = lines[start:end + 1]

              def block_bounds(anchor):
                  idx = [i for i, ln in enumerate(body)
                         if anchor in ln and ln.strip().endswith('{')]
                  if len(idx) != 1:
                      raise SystemExit(
                          'FATAL: block anchor %s count != 1: %d' % (anchor, len(idx)))
                  i = idx[0]
                  d = 0
                  for j in range(i, len(body)):
                      d += body[j].count('{') - body[j].count('}')
                      if d == 0 and j > i:
                          return i, j
                  raise SystemExit('FATAL: block anchor %s has no closing brace' % anchor)

              js, je = block_bounds('if (p->java_surface)')
              rs, re = block_bounds('if (p->reader)')
              hw_idx = [i for i, ln in enumerate(body)
                        if 'hwdec_devices_remove(hw->devs, &p->hwctx);' in ln]
              buf_idx = [i for i, ln in enumerate(body)
                         if 'av_buffer_unref(&p->hwctx.av_device_ref);' in ln]
              if len(hw_idx) != 1 or len(buf_idx) != 1:
                  raise SystemExit('FATAL: uninit remove anchors not unique')
              if not (hw_idx[0] < js and buf_idx[0] < js):
                  raise SystemExit('FATAL: unexpected uninit layout')

              before = Counter(ln.strip() for ln in body if ln.strip())
              prefix = [ln for k, ln in enumerate(body[:js])
                        if k not in (hw_idx[0], buf_idx[0])]
              jblock = body[js:je + 1]
              rblock = body[rs:re + 1]
              between = body[je + 1:rs]
              tail = body[re + 1:]
              new_body = (prefix + [marker_line] + jblock + between + rblock +
                          ['', body[hw_idx[0]], body[buf_idx[0]]] + tail)

              after = Counter(ln.strip() for ln in new_body if ln.strip())
              if after - before != Counter({marker_line.strip(): 1}) or before - after:
                  raise SystemExit('FATAL: uninit lines changed beyond reorder')

              def pos(needle):
                  hits = [i for i, ln in enumerate(new_body) if needle in ln]
                  if len(hits) != 1:
                      raise SystemExit('FATAL: order anchor %s count != 1' % needle)
                  return hits[0]

              order = [
                  pos('MP_JNI_CALL_VOID(p->java_surface, p->surface_release_id);'),
                  pos('MP_JNI_GLOBAL_FREEP(&p->java_surface);'),
                  pos('p->AImageReader_delete(p->reader);'),
                  pos('hwdec_devices_remove(hw->devs, &p->hwctx);'),
                  pos('av_buffer_unref(&p->hwctx.av_device_ref);'),
              ]
              if order != sorted(order):
                  raise SystemExit('FATAL: uninit release order is not monotonic')

              new_src = '\n'.join(lines[:start] + new_body + lines[end + 1:])
              for feat in feature_anchors:
                  if feat not in new_src:
                      raise SystemExit('FATAL: NeoPlayer feature lost: ' + feat)
              open(path, 'w', encoding='utf-8', newline='\n').write(new_src)
              print('patched', path)
          PY
          grep -n 'PATCH: aimagereader uninit release order' buildscripts/deps/mpv/video/out/hwdec/hwdec_aimagereader.c
          # PATCH: EOF frame reset (adapted from mpv-player/mpv PR #14631).
          # On file transition, release VO frame references so the existing
          # FFmpeg MediaCodec.stop() fix can run instead of leaving the old
          # codec connected to the AImageReader surface. Additive-only patch.
          python3 .github/scripts/frame_reset_patch.py buildscripts/deps/mpv
          grep -n 'PATCH: vo_eof_reset A' buildscripts/deps/mpv/player/loadfile.c
          grep -n 'PATCH: vo_eof_reset E2' buildscripts/deps/mpv/video/out/vo.c
          grep -n 'PATCH: vo_eof_reset F' buildscripts/deps/mpv/video/out/vo.h
          grep -n 'PATCH: vo_eof_reset H' buildscripts/deps/mpv/video/out/vo_gpu.c
          grep -n 'PATCH: vo_eof_reset I' buildscripts/deps/mpv/video/out/gpu/video.c
          grep -n 'PATCH: vo_eof_reset J' buildscripts/deps/mpv/video/out/gpu/video.h
          grep -n 'PATCH: vo_eof_reset K2' buildscripts/deps/mpv/video/out/vo_gpu_next.c
          grep -n 'PATCH: vo_eof_reset L' buildscripts/deps/mpv/video/out/vo_libmpv.c
          grep -n 'PATCH: mediacodec close probe' buildscripts/deps/ffmpeg/libavcodec/mediacodecdec_common.c
          for feat in HAVE_VULKAN supports_gpu_dovi_mapping AImage_getDataSpace IMAGE_TIMESTAMP_TOLERANCE_NS retain_previous_frame AImageReader_acquireLatestImageAsync AImage_deleteAsync AImageReader_newWithUsage 'AImageReader stats'; do
            grep -q "$feat" buildscripts/deps/mpv/video/out/hwdec/hwdec_aimagereader.c || { echo "MISSING NeoPlayer feature: $feat"; exit 1; }
          done
          echo 'NeoPlayer feature anchors preserved'
          # Exact NextPlayerCloud recipe uses vanilla libdvdnav/libdvdread/libbluray tarballs.
          test -f buildscripts/deps/libdvdnav/src/dvdnav/dvdnav.h
          ls -d buildscripts/deps/libdvdread buildscripts/deps/libdvdnav buildscripts/deps/libbluray
          cd buildscripts
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh --arch arm64 -n

      - name: Verify ISO/AVC/JNI artifacts
        run: |
          set -e
          MPV_SO=$(find buildscripts -name libmpv.so | head -1)
          echo "libmpv: $MPV_SO"
          test -n "$MPV_SO"
          grep -a -q "dvdnav_open" "$MPV_SO" && echo "FOUND dvdnav_open" || { echo "MISSING dvdnav_open"; exit 1; }
          if grep -a -q "ISO detected" "$MPV_SO"; then echo "FOUND stream_iso strings"; else echo "MISSING stream_iso strings"; exit 1; fi
          if grep -a -q "force-iso" "$MPV_SO"; then echo "FOUND force-iso"; else echo "MISSING force-iso"; exit 1; fi
          if grep -a -q "libbluray" "$MPV_SO" || grep -a -q "bd_open_stream" "$MPV_SO" || grep -a -q "bluray" "$MPV_SO"; then echo "FOUND bluray support"; else echo "MISSING bluray support"; exit 1; fi
          grep -n 'PATCH: hwdec H.264' buildscripts/deps/mpv/player/video.c
          grep -n 'PATCH: disc slave demuxer cache' buildscripts/deps/mpv/demux/demux_disc.c
          grep -n 'PATCH: always allow demuxer prefetch' buildscripts/deps/mpv/demux/demux_disc.c
          grep -n 'PATCH: aimagereader uninit release order' buildscripts/deps/mpv/video/out/hwdec/hwdec_aimagereader.c
          grep -n 'PATCH: vo_eof_reset A' buildscripts/deps/mpv/player/loadfile.c
          grep -n 'PATCH: vo_eof_reset E2' buildscripts/deps/mpv/video/out/vo.c
          grep -n 'PATCH: vo_eof_reset F' buildscripts/deps/mpv/video/out/vo.h
          grep -n 'PATCH: vo_eof_reset K2' buildscripts/deps/mpv/video/out/vo_gpu_next.c
          grep -n 'PATCH: mediacodec close probe' buildscripts/deps/ffmpeg/libavcodec/mediacodecdec_common.c
          grep -n 'Send MPVNode.None instead' app/src/main/jni/event.cpp
          AAR=app/build/outputs/aar/app-release.aar
          test -f "$AAR"
          rm -rf /tmp/xn-aar-check
          mkdir -p /tmp/xn-aar-check
          unzip -q "$AAR" -d /tmp/xn-aar-check
          unzip -l "$AAR" | grep 'libplayer.so' || true
          PLAYER_SO=$(find /tmp/xn-aar-check -name libplayer.so | head -1)
          echo "libplayer in AAR: $PLAYER_SO"
          test -n "$PLAYER_SO"
          if grep -a -q "Java_is_xyz_mpv_MPVLib" "$PLAYER_SO"; then echo "FOUND MPVLib JNI"; else echo "MISSING MPVLib JNI"; exit 1; fi
          echo "ISO/AVC/JNI artifact checks passed"

      - name: Upload AAR to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: native-avcfix-mpv042-iso-eof-frame-reset-sync-20261129
        run: |
          set -e
          test -f app/build/outputs/aar/app-release.aar
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "NeoPlayer recipe ISO AAR + HW+ synchronous EOF frame reset" --notes "mpv 0.42.0 + AVC PTS patch + stream_iso/fongmi + always-on disc demuxer prefetch + non-null JNI event node + FFmpeg mediacodec configure retry (20 x 100ms) + FFmpeg close diagnostics + hwdec_aimagereader.c uninit() release order fix + synchronous EOF frame reset adapted from mpv PR #14631 (vo_wakeup + vo_control VOCTRL_RESET/FRAME_RESET, no async duplicate) so old frame references are released before decoder teardown, preserving all NeoPlayer features (Vulkan, DV mapping, HDR colorspace, stale-frame check, retained frames, async images, max_images=5, stats) + DVD/Blu-ray/ISO, FFmpeg release-8.1-fongmi, libplacebo fongmi"
          gh release upload "$TAG" app/build/outputs/aar/app-release.aar --clobber
